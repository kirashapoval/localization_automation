<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Localizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#10b981', // Emerald 500
                        dark: {
                            950: '#020403', // Deepest black/green
                            900: '#06100b',
                            850: '#0d1814',
                            800: '#131f1b',
                            700: '#1c2b26'
                        },
                        glass: {
                            border: 'rgba(255, 255, 255, 0.08)',
                            surface: 'rgba(6, 16, 11, 0.6)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-1000px 0' },
                            '100%': { backgroundPosition: '1000px 0' }
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #020403;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.15), transparent 40%),
                radial-gradient(circle at 0% 40%, rgba(16, 185, 129, 0.05), transparent 25%);
            background-attachment: fixed;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #06100b; }
        ::-webkit-scrollbar-thumb { background: #1c2b26; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }
        
        .terminal-line {
            animation: fadeIn 0.2s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism */
        .glass-panel {
            background: rgba(13, 24, 20, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .glass-input:hover, .glass-input:focus-within {
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.05);
        }

        /* Animated Progress Bar */
        .progress-glow {
            background: linear-gradient(90deg, #059669, #10b981, #34d399, #10b981, #059669);
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex flex-col selection:bg-primary/30 selection:text-white">

    <!-- Header -->
    <header class="border-b border-white/5 bg-dark-950/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="bg-white/5 p-2.5 rounded-xl border border-white/5 shadow-lg shadow-black/20">
                    <svg class="w-5 h-5 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
                    </svg>
                </div>
                <h1 class="text-lg font-medium tracking-tight text-white">HTML Localizer</h1>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/5 text-xs font-medium text-slate-400">
                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                Powered by Gemini AI
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-6 py-12 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Controls -->
        <div class="lg:col-span-5 space-y-6">
            
            <div class="space-y-2 mb-8">
                <h2 class="text-3xl font-bold text-white tracking-tight">Start Localization</h2>
                <p class="text-slate-400">Upload your HTML files and let AI handle the rest.</p>
            </div>

            <!-- Upload Section -->
            <div class="glass-panel rounded-2xl p-1 overflow-hidden">
                <div class="bg-dark-900/50 p-6 rounded-xl space-y-4">
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-white font-medium">Files</span>
                        <div class="flex items-center gap-3">
                             <span id="file-count" class="text-xs bg-white/10 px-2 py-0.5 rounded text-slate-300">0 files</span>
                             <button id="clear-files" class="text-xs text-red-400 hover:text-red-300 transition-colors">Clear</button>
                        </div>
                    </div>

                    <div id="drop-zone" class="glass-input rounded-xl border-dashed p-8 text-center cursor-pointer group relative overflow-hidden">
                        <input type="file" id="file-input" multiple accept=".html,.htm" class="hidden">
                        
                        <div class="relative z-10 flex flex-col items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-white/5 flex items-center justify-center text-slate-400 group-hover:text-primary group-hover:scale-110 transition-all duration-300">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                </svg>
                            </div>
                            <div class="space-y-1">
                                <p class="text-sm text-slate-200 font-medium">Drop files here or click to upload</p>
                            </div>
                        </div>
                    </div>

                    <!-- File List -->
                    <div id="file-list" class="hidden">
                        <div id="files-container" class="max-h-[180px] overflow-y-auto pr-2 space-y-2 custom-scrollbar">
                            <!-- Files injected here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Language Selection -->
            <div class="glass-panel rounded-2xl p-6">
                <h3 class="text-white font-medium mb-4 text-sm">Target Languages</h3>
                
                <div class="grid grid-cols-3 gap-2">
                    <!-- German -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="de" class="peer sr-only" checked>
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇩🇪</div>
                            <div class="text-xs font-medium">DE</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>
                    
                    <!-- Spanish -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="es" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇪🇸</div>
                            <div class="text-xs font-medium">ES</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>

                    <!-- French -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="fr" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇫🇷</div>
                            <div class="text-xs font-medium">FR</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>

                    <!-- Italian -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="it" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇮🇹</div>
                            <div class="text-xs font-medium">IT</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>
                    
                    <!-- Japanese -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="ja" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇯🇵</div>
                            <div class="text-xs font-medium">JA</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>

                    <!-- Dutch -->
                     <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="nl" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇳🇱</div>
                            <div class="text-xs font-medium">NL</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>

                     <!-- Turkish -->
                    <label class="cursor-pointer group relative">
                        <input type="checkbox" name="lang" value="tr" class="peer sr-only">
                        <div class="glass-input p-3 rounded-lg text-center peer-checked:bg-primary/10 peer-checked:border-primary peer-checked:text-white hover:bg-white/5 transition-all h-full flex flex-col justify-center">
                            <div class="text-lg mb-1">🇹🇷</div>
                            <div class="text-xs font-medium">TR</div>
                        </div>
                        <div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity">
                            <svg class="w-3 h-3 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Action Button -->
            <button id="start-btn" disabled class="w-full py-4 px-6 bg-white text-black hover:bg-slate-200 disabled:bg-dark-800 disabled:text-dark-600 disabled:cursor-not-allowed font-bold rounded-xl shadow-lg shadow-white/5 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 tracking-tight">
                <span>Run Localization</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>

        </div>

        <!-- Right Column: Output & Terminal -->
        <div class="lg:col-span-7 flex flex-col h-full space-y-6">
            
            <!-- Terminal Window -->
            <div class="glass-panel rounded-2xl flex flex-col flex-1 overflow-hidden relative min-h-[500px]">
                <!-- Terminal Header -->
                <div class="bg-black/20 px-5 py-4 border-b border-white/5 flex items-center justify-between">
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-white/10"></div>
                        <div class="w-3 h-3 rounded-full bg-white/10"></div>
                    </div>
                    <span class="text-xs text-slate-500 font-mono tracking-wide">TERMINAL OUTPUT</span>
                </div>
                
                <!-- Terminal Content -->
                <div id="terminal" class="p-6 font-mono text-xs leading-relaxed text-slate-400 overflow-y-auto flex-1 space-y-1.5">
                    <div class="text-slate-600 italic">// Ready to process...</div>
                </div>
                
                <!-- Modern Animated Progress Bar -->
                <div id="progress-container" class="absolute bottom-0 left-0 w-full bg-dark-950/90 backdrop-blur-xl border-t border-white/5 p-6 hidden">
                    <div class="flex justify-between text-xs text-white font-medium mb-3 tracking-wide">
                        <span id="progress-text">Initializing...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                    <div class="w-full bg-dark-800 rounded-full h-1.5 overflow-hidden">
                        <div id="progress-bar" class="progress-glow h-full rounded-full transition-all duration-300 w-0"></div>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div id="results-section" class="glass-panel rounded-2xl p-6 hidden border-l-4 border-l-primary">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-white font-medium flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-primary shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span>
                        Translation Complete
                    </h3>
                    <span class="text-xs text-slate-500">Files saved to output folder</span>
                </div>
                <div id="download-links" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <!-- Download links injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Logic -->
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const filesContainer = document.getElementById('files-container');
        const fileCount = document.getElementById('file-count');
        const clearFilesBtn = document.getElementById('clear-files');
        const startBtn = document.getElementById('start-btn');
        const terminal = document.getElementById('terminal');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressPercent = document.getElementById('progress-percent');
        const resultsSection = document.getElementById('results-section');
        const downloadLinks = document.getElementById('download-links');

        let selectedFiles = [];

        // Drag & Drop Handling
        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-primary', 'bg-white/5');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-primary', 'bg-white/5');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-primary', 'bg-white/5');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            e.target.value = '';
        });
        
        // Clear files button
        clearFilesBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedFiles = [];
            updateFileList();
        });

        function handleFiles(files) {
            const newFiles = Array.from(files).filter(f => f.name.endsWith('.html') || f.name.endsWith('.htm'));
            
            newFiles.forEach(newFile => {
                const exists = selectedFiles.some(f => f.name === newFile.name);
                if (!exists) {
                    selectedFiles.push(newFile);
                }
            });
            
            updateFileList();
            uploadFiles(selectedFiles);
        }

        function updateFileList() {
            if (selectedFiles.length > 0) {
                fileList.classList.remove('hidden');
                fileCount.textContent = `${selectedFiles.length} files`;
                filesContainer.innerHTML = selectedFiles.map((f, idx) => `
                    <div class="flex items-center gap-3 bg-white/5 px-3 py-2.5 rounded-lg border border-white/5 hover:border-white/10 transition-colors group">
                        <div class="flex items-center justify-center w-6 h-6 bg-black/30 rounded text-xs text-slate-400 font-mono">
                            ${String(idx + 1).padStart(2, '0')}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm text-slate-200 truncate font-medium">${f.name}</div>
                            <div class="text-[10px] text-slate-500 uppercase tracking-wider">${(f.size / 1024).toFixed(1)} KB</div>
                        </div>
                        <button onclick="removeFile(${idx})" class="text-slate-500 hover:text-red-400 transition-colors p-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    </div>
                `).join('');
                startBtn.disabled = false;
            } else {
                fileList.classList.add('hidden');
                fileCount.textContent = '0 files';
                startBtn.disabled = true;
            }
        }
        
        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
            if (selectedFiles.length > 0) {
                uploadFiles(selectedFiles);
            }
        }

        async function uploadFiles(files) {
            const formData = new FormData();
            files.forEach(file => formData.append('files[]', file));

            log('Uploading files...', 'text-slate-400');
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                log(`✓ Uploaded ${data.files.length} files. Ready.`, 'text-primary');
            } catch (error) {
                log('Upload failed: ' + error, 'text-red-400');
            }
        }

        // Translation Process
        startBtn.addEventListener('click', async () => {
            const languages = Array.from(document.querySelectorAll('input[name="lang"]:checked')).map(cb => cb.value);
            
            if (languages.length === 0) {
                alert('Please select at least one language');
                return;
            }

            startBtn.disabled = true;
            startBtn.classList.add('opacity-50');
            progressContainer.classList.remove('hidden');
            resultsSection.classList.add('hidden');
            terminal.innerHTML = ''; // Clear terminal
            log('Initializing translation process...', 'text-white');

            // Start SSE stream
            const eventSource = new EventSource('/stream');
            
            eventSource.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                if (data.type === 'ping') return;

                if (data.percent !== undefined) {
                    updateProgress(data.percent, data.message);
                } else if (data.message) {
                    log(data.message);
                }

                if (data.type === 'complete') {
                    eventSource.close();
                    handleComplete(data.files);
                }
                
                if (data.type === 'error') {
                    eventSource.close();
                    log('Error: ' + data.message, 'text-red-500 font-bold');
                    startBtn.disabled = false;
                    startBtn.classList.remove('opacity-50');
                }
            };

            // Trigger backend
            try {
                await fetch('/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ languages })
                });
            } catch (error) {
                log('Failed to start: ' + error, 'text-red-400');
            }
        });

        function updateProgress(percent, text) {
            progressBar.style.width = `${percent}%`;
            progressPercent.textContent = `${Math.round(percent)}%`;
            if (text) progressText.textContent = text;
        }

        function handleComplete(files) {
            progressContainer.classList.add('hidden');
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50');
            log('Process finished successfully!', 'text-primary font-bold');
            
            resultsSection.classList.remove('hidden');
            downloadLinks.innerHTML = files.map(f => `
                <a href="/download/${f}" class="flex items-center gap-2 p-3 rounded-lg bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-all border border-white/5 group">
                    <div class="p-1.5 rounded bg-primary/10 text-primary group-hover:bg-primary group-hover:text-black transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    </div>
                    <span class="text-sm font-medium truncate">${f}</span>
                </a>
            `).join('');
        }

        function log(msg, className = '') {
            const div = document.createElement('div');
            div.className = `terminal-line ${className} py-0.5`;
            
            // Add timestamp
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            div.innerHTML = `<span class="text-slate-700 mr-2 text-[10px] font-mono">[${time}]</span> <span class="font-mono">${msg}</span>`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
